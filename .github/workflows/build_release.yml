name: Build and Release

on:
  push:
    tags:
      - 'v*' # 推送类似 v1.0.0 的 Tag 时自动触发发布
  workflow_dispatch: # 允许在 Actions 页面手动触发编译

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: Android
            build_cmd: flutter build apk --release
          - os: windows-latest
            target: Windows
            build_cmd: flutter build windows --release

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java (For Android)
        if: matrix.target == 'Android'
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Enable Windows Desktop
        if: matrix.target == 'Windows'
        run: flutter config --enable-windows-desktop

      - name: Get dependencies
        working-directory: ./simple_live_app
        run: flutter pub get

      - name: Build ${{ matrix.target }}
        working-directory: ./simple_live_app
        run: ${{ matrix.build_cmd }}

      - name: Compress Windows Build
        if: matrix.target == 'Windows'
        run: Compress-Archive -Path simple_live_app/build/windows/x64/runner/Release/* -DestinationPath simple_live_windows.zip

      - name: Upload Android APK
        if: matrix.target == 'Android'
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: simple_live_app/build/app/outputs/flutter-apk/app-release.apk

      - name: Upload Windows ZIP
        if: matrix.target == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: windows-zip
          path: simple_live_windows.zip

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            android-apk/app-release.apk
            windows-zip/simple_live_windows.zip
